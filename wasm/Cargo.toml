[package]
name = "wasm"
version = "0.1.1"
authors = ["Thomas Girod <thgirod@hotmail.com>"]
edition = "2018"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.84"
mark = { path = "../mark" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
